# Render Blueprint: New > Blueprint, pick this repo. No Docker, no Node, no training step:
# frontend/dist (the built dashboard) and backend/models/iforest.joblib (the trained AI model) are committed.
services:
  - type: web
    name: traceflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
